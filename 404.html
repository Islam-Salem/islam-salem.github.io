<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة — يلا دورك</title>
<meta name="robots" content="noindex">
<script>
  // Old game addresses → new ones (games that were renamed). Add a line when a game moves.
  const MOVED = {
    "awelnaghma": "sharatalbidaya",
    "SharatAlBidaya": "sharatalbidaya",
    "tashkilat-almontakhab": "tashkila",
  };
  (function(){
    const parts = location.pathname.split("/").filter(Boolean);
    const to = parts.length && MOVED[parts[0]];
    if(to){ parts[0] = to; location.replace("/" + parts.join("/") + location.search + location.hash); }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:"Tajawal",system-ui,sans-serif;color:#14121f;
    background:radial-gradient(circle,rgba(20,18,31,.07) 1.5px,transparent 1.6px) 0 0/20px 20px,#fff3d6}
  .card{background:#fff;border:3px solid #14121f;border-radius:20px;box-shadow:6px 6px 0 #14121f;padding:28px 24px;text-align:center;max-width:380px;width:100%}
  .big{font-family:"Lalezar",sans-serif;font-size:72px;line-height:1;color:#ff3d7f;text-shadow:3px 3px 0 #14121f}
  h1{font-size:22px;margin:10px 0 6px}
  p{margin:0 0 20px;font-weight:700;color:#5b5870}
  a{display:inline-block;background:#ffd23f;color:#14121f;text-decoration:none;font-weight:800;font-size:17px;padding:12px 26px;border-radius:14px;
    border:3px solid #14121f;box-shadow:4px 4px 0 #14121f}
</style>
</head>
<body>
  <div class="card">
    <div class="big">404</div>
    <h1>الصفحة دي مش موجودة!</h1>
    <p>بس الألعاب موجودة.. يلا دورك 👇</p>
    <a href="/">كل الألعاب ▶</a>
  </div>
</body>
</html>
