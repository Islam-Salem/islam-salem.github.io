<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="robots" content="noindex">
<title>مفيش إنترنت — يلا دورك</title>
<style>
  /* self-contained: shown when there is no connection, so no fonts or other files */
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#14121f;
    background:radial-gradient(circle,rgba(20,18,31,.07) 1.5px,transparent 1.6px) 0 0/20px 20px,#fff3d6}
  .card{background:#fff;border:3px solid #14121f;border-radius:20px;box-shadow:6px 6px 0 #14121f;padding:28px 22px;text-align:center;max-width:380px;width:100%}
  img{width:96px;height:96px}
  h1{font-size:24px;margin:8px 0 6px}
  p{margin:0 0 20px;font-weight:700;color:#5b5870;line-height:1.6}
  button{font:inherit;font-weight:800;font-size:17px;background:#ffd23f;color:#14121f;border:3px solid #14121f;border-radius:14px;
    padding:10px 26px;box-shadow:4px 4px 0 #14121f;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>مفيش إنترنت دلوقتي</h1>
    <p>ألعاب النهارده محتاجة اتصال.<br>اتأكد من الإنترنت وجرّب تاني.</p>
    <button onclick="location.reload()">جرّب تاني ↻</button>
  </div>
</body>
</html>
