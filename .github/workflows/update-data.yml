name: Update data (تشكيلة المنتخب)

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  schedule:
    - cron: "17 1 * * 1"    # every Monday ~04:17 Cairo time

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Egypt internationals - pull players and build line-ups
        run: python tashkila/scraper/build_xi.py

      - name: Save data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tashkila/data/xi/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "tashkila: update Egypt national team data"
            git pull --rebase --autostash   # files uploaded while this ran are kept
            git push
          fi
