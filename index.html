<!-- No flash: keep the page hidden until its fonts are ready and the page is built (max 2.5 s) -->
<style>html.wait body{opacity:0}body{transition:opacity .15s}</style>
<script>
(function(){
  var d = document.documentElement; d.classList.add("wait");
  var shown = false; function show(){ if(!shown){ shown = true; d.classList.remove("wait"); } }
  setTimeout(show, 2500);                                    // never stay hidden if fonts are slow/blocked
  var fonts = (document.fonts && document.fonts.load)
    ? Promise.all(["400 1em Lalezar","500 1em Tajawal","700 1em Tajawal","800 1em Tajawal"]
        .map(function(f){ return document.fonts.load(f, "يلا دورك"); })).catch(function(){})
    : Promise.resolve();
  var built = new Promise(function(r){ document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", r) : r(); });
  Promise.all([fonts, built]).then(function(){ requestAnimationFrame(show); }, show);
})();
</script>
<style>
  :root{
    --bg:#fff3d6; --ink:#14121f; --paper:#fff; --muted:#5b5870;
    --sun:#ffd23f; --pink:#ff3d7f; --ok:#2ec27e;
    --b:3px; --sh:5px 5px 0 var(--ink);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Tajawal",system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(circle,rgba(20,18,31,.07) 1.5px,transparent 1.6px) 0 0/20px 20px,var(--bg)}
  a{color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px;display:flex;flex-direction:column;gap:18px}

  /* header */
  .hero{text-align:center;padding-top:6px}
  .logo{width:120px;height:120px;margin:0 auto -4px;display:block}
  h1{font-family:"Lalezar",sans-serif;font-weight:400;font-size:56px;line-height:1;margin:0;text-shadow:4px 4px 0 #fff}
  h1 span{color:var(--pink)}
  .date{display:inline-block;margin-top:10px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;
    padding:4px 14px;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ink);transform:rotate(-1.5deg)}

  /* today's progress */
  .progress{background:var(--paper);border:var(--b) solid var(--ink);border-radius:18px;box-shadow:var(--sh);
    padding:14px 16px;display:flex;align-items:center;gap:14px}
  .progress .dots{display:flex;gap:6px;flex:none}
  .progress .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff}
  .progress .dot.on{background:var(--ok)}
  .progress .txt{flex:1;font-weight:800;font-size:16px;line-height:1.4}
  .progress .txt small{display:block;font-weight:700;font-size:13px;color:var(--muted)}

  /* game cards */
  .games{display:flex;flex-direction:column;gap:16px}
  .card{position:relative;display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;text-decoration:none;
    border:var(--b) solid var(--ink);border-radius:20px;box-shadow:var(--sh);padding:14px;transition:transform .08s}
  .card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .card img{width:76px;height:76px;border-radius:18px;border:var(--b) solid var(--ink);background:#fff}
  .card .tag{display:inline-block;font-size:12px;font-weight:800;background:rgba(255,255,255,.85);color:var(--ink);
    border:2px solid var(--ink);border-radius:999px;padding:1px 9px;margin-bottom:4px}
  .card h2{font-family:"Lalezar",sans-serif;font-weight:400;font-size:28px;line-height:1.15;margin:0}
  .card p{margin:2px 0 0;font-size:15px;font-weight:700;opacity:.85;line-height:1.5}
  .card .go{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
  .btn{font:inherit;font-weight:800;font-size:16px;background:var(--sun);color:var(--ink);border:var(--b) solid var(--ink);
    border-radius:12px;padding:8px 16px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
  .state{font-size:14px;font-weight:800;border-radius:999px;padding:4px 12px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
  .state.done{background:var(--ok);color:#fff}
  .state.started{background:#fff0b3}

  .soon{border:var(--b) dashed rgba(20,18,31,.45);border-radius:20px;padding:16px;text-align:center;font-weight:800;color:var(--muted)}

  footer{text-align:center;font-size:14px;font-weight:800;margin-top:6px}
  footer a{margin:0 8px;text-decoration:none;border-bottom:2px solid rgba(20,18,31,.35)}
  footer .next{display:block;margin-bottom:10px;color:var(--muted)}
  /* install as app */
  .install{display:none;align-items:center;gap:12px;background:var(--sun);border:var(--b) solid var(--ink);border-radius:18px;
    box-shadow:var(--sh);padding:12px 14px}
  .install.show{display:flex}
  .install img{width:46px;height:46px;flex:none}
  .install .t{flex:1;font-weight:800;font-size:15px;line-height:1.4}
  .install .t small{display:block;font-weight:700;font-size:13px;opacity:.75}
  .install .go{flex:none;font:inherit;font-weight:800;font-size:15px;padding:9px 14px;border-radius:12px;cursor:pointer;
    background:var(--ink);color:#fff;border:var(--b) solid var(--ink)}
  .install .x{flex:none;background:none;border:none;font:inherit;font-size:22px;font-weight:800;cursor:pointer;color:var(--ink);padding:0 4px}
  .modal{position:fixed;inset:0;background:rgba(20,18,31,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal.open{display:flex}
  .modal .box{background:var(--paper);border:var(--b) solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);padding:22px;max-width:400px;width:100%}
  .modal h3{margin:0 0 12px;font-family:"Lalezar",sans-serif;font-weight:400;font-size:28px}
  .modal .note{display:none;margin:0 0 14px;font-weight:800;background:#fff4c2;border:2px solid var(--ink);border-radius:12px;padding:10px 12px}
  .isteps{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:12px}
  .isteps li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:16px;font-weight:700;line-height:1.5}
  .isteps .ic{width:40px;height:40px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;background:#fff8e6}
  .isteps svg{width:22px;height:22px}
  .modal .ok{width:100%;cursor:pointer}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:12px;font-weight:800;display:none;z-index:30}
</style>

<body>
<div class="wrap">
  <header class="hero">
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1><span>يلا</span> دورك</h1>
    <div class="date" id="date"></div>
  </header>

  <div class="progress" id="progress">
    <div class="dots" id="dots"></div>
    <div class="txt" id="ptxt"></div>
  </div>

  <!-- Install as app (hidden when already installed) -->
  <div class="install" id="installBox">
    <img src="icons/icon-192.png" alt="">
    <div class="t">ثبّت «يلا دورك» على موبايلك<small>كل ألعاب اليوم في تطبيق واحد</small></div>
    <button class="go" id="installBtn">تثبيت</button>
    <button class="x" id="installX" aria-label="إغلاق">×</button>
  </div>

  <main class="games" id="games"></main>

  <div class="soon">ألعاب جديدة قريبًا ✨</div>

  <footer>
    <span class="next" id="next"></span>
    <a href="about.html">عن يلا دورك</a> · <a href="privacy.html">الخصوصية</a> · <a href="mailto:islamspo@gmail.com">تواصل معنا</a>
  </footer>
</div>

<div class="modal" id="guideM"><div class="box">
  <h3 id="gTitle">ثبّت يلا دورك</h3>
  <p class="note" id="gNote"></p>
  <ul class="isteps" id="gSteps"></ul>
  <button class="btn ok" id="gOk">تمام</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- helpers (also used by games.js) ----------
function readJSON(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function cairoToday(){ return new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Cairo"}).format(new Date()); }
function dayNumber(start){
  const toUTC = s => { const [y,m,d] = s.split("-").map(Number); return Date.UTC(y, m-1, d); };
  return Math.max(1, Math.floor((toUTC(cairoToday()) - toUTC(start)) / 86400000) + 1);
}
</script>
<script src="games.js"></script>
<script>
const $ = id => document.getElementById(id);
const STATE_TXT = { done:"✓ لعبتها النهارده", started:"⏳ كمّلها", new:"لسه ما لعبتهاش" };
const BTN_TXT   = { done:"شوف نتيجتك", started:"كمّل ▶", new:"العب ▶" };

function statusOf(g){ try{ return g.status ? g.status() : "new"; }catch(e){ return "new"; } }

function render(){
  // date
  $("date").textContent = new Date().toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",timeZone:"Africa/Cairo"});

  // cards
  const box = $("games"); box.innerHTML = "";
  let done = 0;
  GAMES.forEach(g => {
    const st = statusOf(g); if(st === "done") done++;
    const a = document.createElement("a");
    a.className = "card"; a.href = g.url;
    a.style.background = g.color; a.style.color = g.ink;
    a.innerHTML = `<img src="${g.icon}" alt="">
      <div><span class="tag"></span><h2></h2><p></p></div>
      <div class="go"><span class="state ${st}">${STATE_TXT[st]}</span><span class="btn">${BTN_TXT[st]}</span></div>`;
    a.querySelector(".tag").textContent = g.tag || "";
    a.querySelector("h2").textContent = g.name;
    a.querySelector("p").textContent = g.desc;
    box.appendChild(a);
  });

  // today's progress
  const n = GAMES.length;
  $("dots").innerHTML = GAMES.map((g,i) => `<span class="dot ${i < done ? "on" : ""}"></span>`).join("");
  $("ptxt").innerHTML = done === n
    ? `خلّصت دورك النهارده! 🎉<small>ارجع بكرة لتحديات جديدة</small>`
    : done === 0
      ? `يلا دورك! 👋<small>عندك ${n} ألعاب النهارده</small>`
      : `لعبت ${done} من ${n} النهارده<small>فاضل ${n - done}.. يلا كمّل!</small>`;
  updateNext();
}
function updateNext(){
  const cairo = new Date(new Date().toLocaleString("en-US",{timeZone:"Africa/Cairo"}));
  const mid = new Date(cairo); mid.setHours(24,0,0,0);
  const ms = mid - cairo, h = Math.floor(ms/3.6e6), m = Math.floor(ms%3.6e6/6e4);
  $("next").textContent = `التحديات الجديدة بعد ${h} ساعة و ${m} دقيقة`;
}
render();
// refresh when coming back to the tab (e.g. after playing a game) and every minute
document.addEventListener("visibilitychange", () => { if(!document.hidden) render(); });
window.addEventListener("pageshow", render);
setInterval(updateNext, 60000);

// ---------- install as app ----------
(function(){
  const box = $("installBox");
  const ua = navigator.userAgent;
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|TikTok|musical_ly|; wv\)/i.test(ua);   // apps' built-in browsers
  const isIOSSafari = isIOS && /safari/i.test(ua) && !/crios|fxios|edgios|gsa\//i.test(ua) && !inApp;
  const KEY = "yd_install_x";
  let dismissed = false; try{ dismissed = Number(localStorage.getItem(KEY) || 0) > Date.now(); }catch(e){}
  let deferred = null;

  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", {scope:"/"}).catch(()=>{});
  if(standalone) return;

  // Show on every phone; on desktop only when the browser offers installing
  if((isIOS || isAndroid) && !dismissed) box.classList.add("show");
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    if(!dismissed) box.classList.add("show");
  });
  window.addEventListener("appinstalled", () => { box.classList.remove("show"); toast("تم التثبيت 🎉"); });

  const ICON = {
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="#14121f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="#14121f" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
    dots:'<svg viewBox="0 0 24 24" fill="#14121f"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>',
    globe:'<svg viewBox="0 0 24 24" fill="none" stroke="#14121f" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
    app:'<img src="icons/icon-192.png" alt="" style="width:32px;height:32px">'
  };
  function guide(title, note, steps){
    $("gTitle").textContent = title;
    $("gNote").style.display = note ? "block" : "none";
    $("gNote").textContent = note || "";
    $("gSteps").innerHTML = steps.map(([ic, html]) => `<li><div class="ic">${ICON[ic]}</div><div>${html}</div></li>`).join("");
    $("guideM").classList.add("open");
  }
  $("gOk").onclick = () => $("guideM").classList.remove("open");
  $("guideM").onclick = e => { if(e.target === $("guideM")) $("guideM").classList.remove("open"); };

  $("installBtn").onclick = async () => {
    if(deferred){                                   // Android/Chrome: direct install
      deferred.prompt();
      const r = await deferred.userChoice.catch(()=>null);
      deferred = null;
      if(r && r.outcome === "accepted") box.classList.remove("show");
      return;
    }
    if(inApp || (isIOS && !isIOSSafari)){
      guide("افتح الموقع في المتصفح",
        isIOS ? "التثبيت على الآيفون يعمل من Safari فقط." : "التطبيقات زي فيسبوك وإنستجرام لا تسمح بالتثبيت من داخلها.",
        [["dots", "اضغط زر <b>القائمة</b> (⋯ أو ⋮) في أعلى أو أسفل الشاشة"],
         ["globe", isIOS ? "اختر <b>«فتح في Safari»</b>" : "اختر <b>«فتح في Chrome»</b> أو «فتح في المتصفح»"],
         ["app", "ثم اضغط «تثبيت» مرة أخرى من هناك"]]);
    } else if(isIOS){
      guide("ثبّته على الآيفون", "",
        [["share", "اضغط زر <b>المشاركة</b> في شريط Safari"],
         ["plus", "اختر <b>«إضافة إلى الشاشة الرئيسية»</b>"],
         ["app", "اضغط <b>«إضافة»</b> — وهتلاقي «يلا دورك» على شاشتك!"]]);
    } else {
      guide("ثبّته على موبايلك", "",
        [["dots", "اضغط زر <b>القائمة ⋮</b> أعلى الشاشة في Chrome"],
         ["plus", "اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>"],
         ["app", "اضغط <b>«تثبيت»</b> — وهتلاقي «يلا دورك» على شاشتك!"]]);
    }
  };
  $("installX").onclick = () => {                  // hide for 14 days
    box.classList.remove("show");
    try{ localStorage.setItem(KEY, String(Date.now() + 14*864e5)); }catch(e){}
  };
})();
function toast(t){ const el = $("toast"); el.textContent = t; el.style.display = "block"; setTimeout(() => el.style.display = "none", 2200); }
</script>
</body>
